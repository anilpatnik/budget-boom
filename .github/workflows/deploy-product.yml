name: Build and Deploy

on:
  push:
    branches: [product]

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
  GOOGLE_CREDENTIALS: ${{ secrets.PROD_GOOGLE_CREDENTIALS }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.PROD_WORKLOAD_IDENTITY_PROVIDER }}
  REGION: us-central1
  REPOSITORY: gcf-artifacts
  SERVICE_NAME: express-api
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.PROD_FIREBASE_PROJECT_ID }}/gcf-artifacts/express-api:latest

jobs:
  changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
            frontend:
              - 'client/**'

  build-deploy-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - name: 📦 Install Dependencies and Build
        run: |
          npm ci
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.PROD_FIREBASE_APP_ID }}
          VITE_CAPTCHA_SITE: ${{ secrets.PROD_CAPTCHA_SITE }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GOOGLE_CREDENTIALS }}
      - name: 📥 Install Firebase CLI
        run: npm install -g firebase-tools
      - name: 🚀 Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project ${{ github.ref_name }}

  build-deploy-backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: true # ${{ needs.changes.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - name: Encode GOOGLE_CREDENTIALS to Base64
        id: encode_creds
        run: |
          echo "ENCODED_CREDS=$(echo '${{ secrets.GOOGLE_CREDENTIALS }}' | base64 -w 0)" >> $GITHUB_OUTPUT
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_CREDENTIALS }}
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          allow_unauthenticated: true
          ingress: all
          set_env_vars: |
            ENVIRONMENT=production
            TOKEN_SECRET=${{ secrets.PROD_TOKEN_SECRET }}
            CAPTCHA_SECRET=${{ secrets.PROD_CAPTCHA_SECRET }}
            DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
            GOOGLE_CREDENTIALS=${{ steps.encode_creds.outputs.ENCODED_CREDS }}
