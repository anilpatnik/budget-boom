name: Build and Deploy

on:
  push:
    branches:
      - develop
      - product

env:
  ENV_NAME: ${{ github.ref_name == 'product' && 'PROD' || 'TEST' }}

jobs:
  changes:
    if: true
    runs-on: ubuntu-latest
    name: Paths Changes Filter
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
            frontend:
              - 'client/**'

  build-deploy-backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Build Backend
        run: npm ci && npm install @swc/core --legacy-peer-deps && npm run build
        working-directory: ./server

      - name: Create .env File
        run: |
          touch .env          
          echo ENVIRONMENT=${{ secrets[format('{0}_ENVIRONMENT', env.ENV_NAME)] }} >> .env
          echo TOKEN_SECRET=${{ secrets[format('{0}_TOKEN_SECRET', env.ENV_NAME)] }} >> .env
          echo CAPTCHA_SECRET=${{ secrets[format('{0}_CAPTCHA_SECRET', env.ENV_NAME)] }} >> .env
          echo DATABASE_URL=${{ secrets[format('{0}_DATABASE_URL', env.ENV_NAME)] }} >> .env
          cat .env
        working-directory: ./server

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate with Firebase
        run: firebase use --token ${{ secrets.FIREBASE_TOKEN }} ${{ github.ref_name }}

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --force --token ${{ secrets.FIREBASE_TOKEN }}

  build-deploy-frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Build Frontend
        run: npm ci && npm run build
        working-directory: ./client
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets[format('{0}_FIREBASE_API_KEY', env.ENV_NAME)] }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets[format('{0}_FIREBASE_PROJECT_ID', env.ENV_NAME)] }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets[format('{0}_FIREBASE_MESSAGING_SENDER_ID', env.ENV_NAME)] }}
          VITE_FIREBASE_APP_ID: ${{ secrets[format('{0}_FIREBASE_APP_ID', env.ENV_NAME)] }}
          VITE_CAPTCHA_SITE: ${{ secrets[format('{0}_CAPTCHA_SITE', env.ENV_NAME)] }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate with Firebase
        run: firebase use --token ${{ secrets.FIREBASE_TOKEN }} ${{ github.ref_name }}

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}
