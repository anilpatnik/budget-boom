name: Build and Deploy

on:
  push:
    branches:
      - develop
      - product

env:
  ENV_NAME: ${{ github.ref_name == 'product' && 'PROD' || 'TEST' }}

jobs:
  build-deploy-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build Frontend
        run: npm ci && npm run build
        working-directory: ./client
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets[format('{0}_FIREBASE_API_KEY', env.ENV_NAME)] }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets[format('{0}_FIREBASE_PROJECT_ID', env.ENV_NAME)] }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets[format('{0}_FIREBASE_MESSAGING_SENDER_ID', env.ENV_NAME)] }}
          VITE_FIREBASE_APP_ID: ${{ secrets[format('{0}_FIREBASE_APP_ID', env.ENV_NAME)] }}
          VITE_CAPTCHA_SITE: ${{ secrets[format('{0}_CAPTCHA_SITE', env.ENV_NAME)] }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate with Firebase
        run: firebase use --token ${{ secrets.FIREBASE_TOKEN }} ${{ github.ref_name }}

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}
